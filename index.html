<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máy tính sức mua Kho</title>
<style>
:root{
  --bg:#0f172a; --card:#111827; --line:#334155; --text:#f8fafc;
  --muted:#94a3b8; --green:#22c55e; --red:#ef4444; --blue:#38bdf8; --amber:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:min(1000px,100%);padding:7px;display:grid;gap:5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:clamp(17px,3vw,25px)}
button{
  border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;
  background:#0ea5e9;color:white;white-space:nowrap
}
button:disabled{opacity:.6;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.box,.result{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
input{
  width:100%;min-width:0;border:1px solid var(--line);background:#020617;color:var(--text);
  border-radius:8px;padding:7px 5px;font-size:clamp(18px,4vw,23px);font-weight:900;text-align:center;outline:none
}
input:focus{border-color:var(--blue)}
.unit{font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
.live{font-size:10px;text-align:center;margin-top:2px;color:var(--blue)}
.results{display:grid;grid-template-columns:1fr 1fr 1.15fr 1.15fr;gap:5px}
.result{text-align:center}
.k{font-size:11px;color:var(--muted);font-weight:700}
.v{margin-top:4px;font-size:clamp(18px,3.4vw,27px);font-weight:900;line-height:1}
.positive{color:var(--green)} .negative{color:var(--red)} .neutral{color:var(--blue)} .warning{color:var(--amber)}
.footer{font-size:10px;color:var(--muted);text-align:center;line-height:1.25}
#errorBanner{
  display:none;
  background:#3f0b0b;
  border:2px solid var(--red);
  color:#ffb4b4;
  font-weight:900;
  text-align:center;
  border-radius:10px;
  padding:8px 10px;
  font-size:clamp(14px,3.5vw,19px);
  letter-spacing:.2px;
}
@media(max-width:700px){
  .grid{grid-template-columns:1fr 1fr}
  .results{grid-template-columns:1fr 1fr}
  .top{align-items:flex-start}
  h1{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Máy tính sức mua Kho</h1>
    <button id="refreshBtn" onclick="loadPrices()">↻ Cập nhật giá</button>
  </div>

  <div id="errorBanner">LỖI KẾT NỐI DỮ LIỆU – NHẬP MANUAL</div>

  <div class="grid">
    <div class="box">
      <label>Số lượng VHM</label>
      <input id="vhmQty" type="number" value="35000" step="1000" min="0" inputmode="numeric">
      <div class="unit">cổ phiếu</div>
    </div>
    <div class="box">
      <label>Giá VHM</label>
      <input id="vhmPrice" type="number" value="61.0" step="0.1" min="0" inputmode="decimal">
      <div id="vhmLive" class="live">chưa tải giá</div>
    </div>
    <div class="box">
      <label>Số lượng FPT</label>
      <input id="fptQty" type="number" value="35000" step="1000" min="0" inputmode="numeric">
      <div class="unit">cổ phiếu</div>
    </div>
    <div class="box">
      <label>Giá FPT</label>
      <input id="fptPrice" type="number" value="57.1" step="0.1" min="0" inputmode="decimal">
      <div id="fptLive" class="live">chưa tải giá</div>
    </div>
  </div>

  <div class="results">
    <div class="result">
      <div class="k">NAV2</div>
      <div id="nav2Out" class="v neutral">-</div>
    </div>
    <div class="result">
      <div class="k">Tỷ lệ cọc</div>
      <div id="ratioOut" class="v">-</div>
    </div>
    <div class="result">
      <div class="k">Sức mua Kho</div>
      <div id="bpOut" class="v">-</div>
    </div>
    <div class="result">
      <div class="k">Mua thêm VHM tối đa</div>
      <div id="vhmBuyOut" class="v">-</div>
    </div>
  </div>

  <div id="status" class="footer"></div>
  <div id="source" class="footer">Tự cập nhật khoảng 5 giây/lần. Nguồn: KBS public → CafeF dự phòng → nhập tay.</div>
</div>

<script>
const NAV1 = 1019839225;
const VHM_COST = 2282310000 / 35000;
const FPT_COST = 2052481714 / 35000;
const BUY_FEE = 0.0015;
const SELL_NET_FACTOR = 0.9975 * 0.9991;
const ACCRUED_INTEREST = 7609959;
const REQUIRED_RATIO = 0.20;
const AUTO_REFRESH_MS = 5000;

const $ = id => document.getElementById(id);
let loading = false;

function fmtMoney(n){
  const sign=n<0?"-":"", x=Math.abs(n);
  if(x>=1e9) return sign+(x/1e9).toFixed(3).replace(".",",")+" tỷ";
  if(x>=1e6) return sign+(x/1e6).toFixed(1).replace(".",",")+" tr";
  return Math.round(n).toLocaleString("vi-VN");
}
function fmtShares(n){return Math.max(0,Math.floor(n)).toLocaleString("vi-VN")+" cp"}

function calc(){
  const vq=+$("vhmQty").value||0, vpK=+$("vhmPrice").value||0, vp=vpK*1000;
  const fq=+$("fptQty").value||0, fp=(+$("fptPrice").value||0)*1000;

  const grossCost=vq*VHM_COST+fq*FPT_COST;
  const totalBuy=grossCost*(1+BUY_FEE);
  const marketValue=vq*vp+fq*fp;
  const netSell=marketValue*SELL_NET_FACTOR;
  const nav2=NAV1+netSell-totalBuy-ACCRUED_INTEREST;
  const ratio=totalBuy>0?nav2/totalBuy:0;
  const buyingPower=5*nav2-totalBuy;
  const costPerNewVhm=vp*(1+BUY_FEE);
  const canBuy=(buyingPower>0&&costPerNewVhm>0)?Math.floor(buyingPower/costPerNewVhm):0;

  $("nav2Out").textContent=fmtMoney(nav2);
  $("ratioOut").textContent=(ratio*100).toFixed(2).replace(".",",")+"%";
  $("bpOut").textContent=fmtMoney(buyingPower);
  $("vhmBuyOut").textContent=fmtShares(canBuy);

  $("ratioOut").className="v "+(ratio>=REQUIRED_RATIO?"positive":"negative");
  $("bpOut").className="v "+(buyingPower>=0?"positive":"negative");
  $("vhmBuyOut").className="v "+(canBuy>0?"positive":"negative");

  if(ratio<REQUIRED_RATIO){
    const shortfall=REQUIRED_RATIO*totalBuy-nav2;
    $("status").innerHTML="Thiếu khoảng <b>"+fmtMoney(shortfall)+"</b> để cọc đạt 20%.";
  }else{
    $("status").innerHTML="Có thể mua thêm khoảng <b>"+fmtShares(canBuy)+"</b> VHM tại giá hiện tại.";
  }
}

async function fetchJson(url){
  const options={cache:"no-store",headers:{"Accept":"application/json,text/plain,*/*"}};
  try{
    const r=await fetch(url,options);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e1){
    const p="https://api.allorigins.win/raw?url="+encodeURIComponent(url);
    const r=await fetch(p,{cache:"no-store"});
    if(!r.ok) throw new Error("Proxy HTTP "+r.status);
    return await r.json();
  }
}

async function fetchKBS(symbol){
  const url="https://kbbuddywts.kbsec.com.vn/iis-server/investment/trade/history/"
    +encodeURIComponent(symbol)+"?page=1&limit=1&_="+Date.now();
  const j=await fetchJson(url);
  const row=Array.isArray(j?.data)&&j.data.length?j.data[0]:null;
  if(!row) throw new Error("KBS no data");
  let p=Number(row.FMP ?? row.price ?? row.matchPrice);
  if(!Number.isFinite(p)||p<=0) throw new Error("KBS bad price");
  if(p<1000) p*=1000;
  return p/1000;
}

function collectObjects(x,out=[]){
  if(!x||typeof x!=="object") return out;
  if(Array.isArray(x)){ for(const v of x) collectObjects(v,out); }
  else{
    out.push(x);
    for(const k of Object.keys(x)) collectObjects(x[k],out);
  }
  return out;
}
function readSymbol(obj){
  const keys=["symbol","Symbol","code","Code","stockCode","StockCode","ticker","Ticker","MaCK","mack"];
  for(const k of keys) if(obj[k]!=null) return String(obj[k]).toUpperCase();
  return "";
}
function readPrice(obj){
  const keys=["price","Price","matchPrice","MatchPrice","currentPrice","CurrentPrice",
              "lastPrice","LastPrice","closePrice","ClosePrice","close","Close","GiaKhop","giaKhop"];
  for(const k of keys){
    if(obj[k]!=null){
      let v=typeof obj[k]==="string"?Number(obj[k].replace(/,/g,"")):Number(obj[k]);
      if(Number.isFinite(v)&&v>0){
        if(v<1000) v*=1000;
        if(v>=10000&&v<=300000) return v/1000;
      }
    }
  }
  return null;
}

async function fetchCafeFPair(){
  const url="https://cafef.vn/du-lieu/Ajax/PageNew/RealtimePricesHeader.ashx?symbols=VHM;FPT&_="+Date.now();
  const j=await fetchJson(url);
  const objs=collectObjects(j);
  const ans={};
  for(const o of objs){
    const s=readSymbol(o);
    const p=readPrice(o);
    if((s==="VHM"||s==="FPT")&&p) ans[s]=p;
  }
  if(!ans.VHM&&!ans.FPT) throw new Error("CafeF parse fail");
  return ans;
}

async function getPrice(symbol){
  try{
    const p=await fetchKBS(symbol);
    return {price:p,source:"KBS"};
  }catch(e){}
  try{
    const pair=await fetchCafeFPair();
    if(pair[symbol]) return {price:pair[symbol],source:"CafeF"};
  }catch(e){}
  throw new Error("No public price source");
}

async function loadPrices(){
  if(loading) return;
  loading = true;
  const btn=$("refreshBtn");
  btn.disabled=true;
  btn.textContent="Đang tải...";

  let ok=0;
  const details=[];

  const results = await Promise.allSettled([
    getPrice("VHM"),
    getPrice("FPT")
  ]);

  if(results[0].status==="fulfilled"){
    const x=results[0].value;
    $("vhmPrice").value=x.price.toFixed(1);
    $("vhmLive").textContent="✓ "+x.source+" "+x.price.toFixed(1);
    $("vhmLive").className="live positive";
    ok++; details.push("VHM "+x.source);
  }else{
    $("vhmLive").textContent="⚠ dùng giá nhập tay";
    $("vhmLive").className="live warning";
  }

  if(results[1].status==="fulfilled"){
    const x=results[1].value;
    $("fptPrice").value=x.price.toFixed(1);
    $("fptLive").textContent="✓ "+x.source+" "+x.price.toFixed(1);
    $("fptLive").className="live positive";
    ok++; details.push("FPT "+x.source);
  }else{
    $("fptLive").textContent="⚠ dùng giá nhập tay";
    $("fptLive").className="live warning";
  }

  const banner=$("errorBanner");
  if(ok<2){
    banner.style.display="block";
    banner.textContent="LỖI KẾT NỐI DỮ LIỆU – NHẬP MANUAL";
  }else{
    banner.style.display="none";
  }

  calc();

  const t=new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("source").textContent=
    (ok?("Đã tải "+ok+"/2 mã lúc "+t+" ("+details.join(", ")+"). "):"Không tải được nguồn công khai. ")
    +"Tự thử lại mỗi 5 giây; có thể nhập tay bất cứ lúc nào.";

  btn.disabled=false;
  btn.textContent="↻ Cập nhật giá";
  loading = false;
}

["vhmQty","vhmPrice","fptQty","fptPrice"].forEach(id=>{
  $(id).addEventListener("input",calc);
  $(id).addEventListener("focus",e=>e.target.select());
});

calc();
loadPrices();
setInterval(loadPrices, AUTO_REFRESH_MS);
</script>
</body>
</html>
